# Configuration for A-share analyzer
# Default parameters used by CLI if not overridden by flags
lookback: 60           # days for momentum/strength
vol_win: 20            # rolling window for volatility (days)
vol_lb: 120            # lookback window for volatility baseline (days)
max_symbols: 30        # max number of symbols to fetch online
topN: 15               # number of top picks to surface
ab_vol_threshold: 2.0  # z-score threshold for abnormal volatility

# Timezone used to date-stamp reports
timezone: Asia/Shanghai
